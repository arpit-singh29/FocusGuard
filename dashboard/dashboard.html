<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Page</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="blocked-attempt">
        <h2>Blocked Attempts</h2>
        <p id="blockedCount"></p>
    </div>

    <div class="focus-streak">
        <h2>Streak</h2>
        <p id="focusStreak"></p>
    </div>

    <div class="total-focus">
        <h2>Total Focus Time</h2>
        <p id="totalFocus"></p>
    </div>
    
    <div class="weekly-report">
        <h2>Weekly Report</h2>

        <p>This Week : <span id="this-week">0</span></p>
        <p>Last Week : <span id="last-week">0</span></p>
        <p>Difference : <span id="difference">0</span></p>
    </div>

    <button id="back">Back</button>
    
    <script src="dashboard.js"></script>
</body>
</html>
